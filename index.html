/* ===== Design italien ===== */
:root{--bg:#f7f0e1;--card:#fffdf7;--ink:#2a211b;--mute:#7b6c5e;--ter:#b8472d;--oli:#4f6b35;--gold:#d4a12c;--line:#e8dcc4;--ok:#2e7d4f;--ko:#c0392b;--verde:#008c45;--rosso:#cd212a;--maio:#2a5c8a;--disp:"Playfair Display",Georgia,"Iowan Old Style",serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}

body{font-family:var(--body);background:var(--bg) radial-gradient(circle at 12% 8%,rgba(212,161,44,.10),transparent 38%),radial-gradient(circle at 92% 92%,rgba(184,71,45,.08),transparent 40%) fixed}
h1,h2,h3,h4,.tx,.card>b,header b{font-family:var(--disp)}
h2{font-size:28px;font-weight:700;margin:6px 0 4px}

header b{font-size:24px;font-style:italic;letter-spacing:.2px}header b span{color:var(--rosso)}
button,.btn{border-radius:999px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .08s,box-shadow .08s}
button:active,.btn:active{transform:translateY(2px);box-shadow:none}
.ghost{box-shadow:none;background:var(--card)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 24px 30px;background:linear-gradient(140deg,#c4502f,#a63a24 60%,#8e2f1d);box-shadow:0 10px 24px rgba(168,58,36,.28)}

{t:"Recherche clinique",v:[["Lo studio clinico","L’étude clinique"],["Il campione","L’échantillon"],["Il gruppo di controllo","Le groupe contrôle"],["Randomizzato","Randomisé"],["L’effetto collaterale","L’effet secondaire"],["La sperimentazione","L’essai"],["Il protocollo","Le protocole"],["Statisticamente significativo","Statistiquement significatif"],["L’arruolamento","Le recrutement"],["L’esito","Le résultat clinique"]],g:["Les relatives réduites",""],

{t:"Institutions & politique",v:[["Il parlamento","Le parlement"],["Il governo","Le gouvernement"],["Approvare una legge","Adopter une loi"],["Il referendum","Le référendum"],["La maggioranza","La majorité"],["L’opposizione","L’opposition"],["Eleggere","Élire"],["Il cittadino","Le citoyen"],["Il diritto","Le droit"],["La riforma","La réforme"]],g:["Subjonctif dans les relatives",""],
r:["Il Parlamento ha approvato una riforma che garantisca maggiore equità. L’opposizione cerca una soluzione che sia accettabile per tutti, ma non c’è nessuno che voglia cedere. La maggioranza è l’unica che possa decidere.",["Qu’a approuvé le Parlement ?",["Une réforme","Un budget","Un référendum"],0],["Qui peut décider ?",["La majorité","L’opposition","Le peuple"],0]],

{t:"Économie",v:[["L’inflazione","L’inflation"],["Il debito","La dette"],["La crescita","La croissance"],["Il mercato del lavoro","Le marché du travail"],["Il potere d’acquisto","Le pouvoir d’achat"],["Gli investimenti","Les investissements"],["La disoccupazione","Le chômage"],["Il bilancio","Le budget"],["Tassare","Taxer"],["La congiuntura","La conjoncture"]],g:["La nominalisation",""],

{t:"Argumenter finement",v:[["Ciò che","Ce que / ce qui"],["Il che","Ce qui (reprenant la phrase)"],["Chi","Celui qui / quiconque"],["Quanto a","Quant à"],["Per quanto riguarda","En ce qui concerne"],["Del resto","D’ailleurs"],["In ogni caso","En tout cas"],["Se non altro","Au moins"],["Anzi","Au contraire"],["Per giunta","En plus"]],g:["Il che, ciò che, chi",""],

{t:"Renchérir & nuancer",v:[["Tanto più che","D’autant plus que"],["Tanto meno","Encore moins"],["Per giunta","En plus"],["Nondimeno","Néanmoins"],["A ogni modo","De toute façon"],["Se mai","Si jamais"],["Tutt’al più","Tout au plus"],["Quantomeno","À tout le moins"],["Nemmeno","Même pas"],["Perfino","Même"]],g:["Les adverbes de renforcement",""],

w:["Écrivez 3 phrases avec nemmeno, tanto più che, tutt’al più.",["nemmeno","tanto più che","tutt’al più"],"Non ho nemmeno guardato. Resto a casa, tanto più che piove. Tutt’al più ci vediamo domani."],
s:["Renforcez une négation.","Non ha nemmeno risposto al messaggio."]},

<script>
var MORE16=[{id:"C2",u:[{"t": "Philosophie & pensée", "v": [["Il pensiero", "La pensée"], ["La coscienza", "La conscience"], ["Il libero arbitrio", "Le libre arbitre"], ["L’esistenza", "L’existence"], ["Il dubbio", "Le doute"], ["La verità", "La vérité"], ["L’etica", "L’éthique"], ["Il senso", "Le sens"], ["Il paradosso", "Le paradoxe"], ["La ragione", "La raison"]], "g": ["Le subjonctif optatif", ""], "r": ["Che sia la ragione a guidarci! Fosse vero ciò che dici, il dubbio svanirebbe. Magari il libero arbitrio esistesse davvero, ma il paradosso resta: più cerchiamo la verità, più ci sfugge.", ["Qu’est-ce qui doit nous guider ?", ["La raison", "Le doute", "La peur"], 0], ["Quel est le paradoxe ?", ["On cherche, on perd la vérité", "On trouve tout", "On ne doute pas"], 0]], "l": ["Che la coscienza ti guidi! Magari fosse così semplice! Viva la libertà di pensiero!", ["Qui doit guider ?", ["La conscience", "Le hasard", "Le maître"], 0], ["Quel souhait pour la pensée ?", ["Qu’elle soit libre", "Qu’elle soit cachée", "Qu’elle cesse"], 0]], "w": ["Écrivez 3 souhaits au subjonctif.", ["che", "magari", "viva"], "Che tu stia bene! Magari fosse vero! Viva la libertà!"], "s": ["Faites un vœu.", "Che la ragione ci guidi!"]}, {"t": "Droit & jurisprudence", "v": [["La sentenza", "Le jugement"], ["Il tribunale", "Le tribunal"], ["L’imputato", "L’accusé"], ["Il ricorso", "Le recours"], ["La giurisprudenza", "La jurisprudence"], ["La colpa", "La faute"], ["La pena", "La peine"], ["Il testimone", "Le témoin"], ["Assolvere", "Acquitter"], ["Condannare", "Condamner"]], "g": ["Participe absolu", ""], "r": ["Esaminati i fatti, il tribunale ha emesso la sentenza. Presentato il ricorso, l’imputato è stato assolto. Letta la giurisprudenza, il giudice ha ridotto la pena.", ["Qui a émis le jugement ?", ["Le tribunal", "Le témoin", "L’accusé"], 0], ["Que s’est-il passé après le recours ?", ["Acquittement", "Condamnation", "Rien"], 0]], "l": ["Ascoltati i testimoni, la giuria si è ritirata. Dimostrata la colpa, il giudice ha condannato l’imputato.", ["Qui a été entendu ?", ["Les témoins", "Les avocats", "Le juge"], 0], ["Que fait le juge ?", ["Condamne", "Acquitte", "Ajourne"], 0]], "w": ["Écrivez 3 phrases avec un participe absolu.", ["esaminati", "finito", "letto"], "Finito il lavoro, sono uscita. Letto il libro, l’ho restituito. Esaminati i fatti, decido."], "s": ["Racontez avec un participe absolu.", "Finito il lavoro, sono uscita."]}, {"t": "Médecine de pointe", "v": [["La terapia genica", "La thérapie génique"], ["L’immunoterapia", "L’immunothérapie"], ["La diagnosi precoce", "Le diagnostic précoce"], ["Il microbiota", "Le microbiote"], ["La medicina personalizzata", "La médecine personnalisée"], ["La telemedicina", "La télémédecine"], ["L’evidenza scientifica", "Les preuves scientifiques"], ["Il trial clinico", "L’essai clinique"], ["La cronicità", "La chronicité"], ["La prevenzione", "La prévention"]], "g": ["Le futur antérieur épistémique", ""], "r": ["Avranno già avviato il trial clinico, immagino. La terapia sarà costata una fortuna! Ci sarà stato un errore nella diagnosi precoce, a quanto pare.", ["Qu’imagine-t-on ?", ["L’essai a déjà démarré", "L’essai est arrêté", "Rien"], 0], ["Sur quoi porte l’erreur ?", ["Le diagnostic", "Le prix", "La loi"], 0]], "l": ["Sarà il microbiota ad aver influito, credo. Avranno scoperto la causa, ma non lo dicono ancora.", ["Quelle hypothèse ?", ["Le microbiote", "L’hérédité", "L’âge"], 0], ["Qu’a-t-on probablement découvert ?", ["La cause", "Un médicament", "Rien"], 0]], "w": ["Écrivez 3 hypothèses au futur.", ["sarà", "avrà", "saranno"], "Sarà stanco. Avrà perso il treno. Saranno già partiti."], "s": ["Faites une hypothèse.", "Sarà stanco, ha lavorato tutta la notte."]}, {"t": "Géopolitique", "v": [["La crisi", "La crise"], ["La diplomazia", "La diplomatie"], ["Il vertice", "Le sommet"], ["L’accordo", "L’accord"], ["Le sanzioni", "Les sanctions"], ["Il conflitto", "Le conflit"], ["Il confine", "La frontière"], ["La migrazione", "La migration"], ["L’alleanza", "L’alliance"], ["La tregua", "La trêve"]], "g": ["Le conditionnel journalistique", ""], "r": ["Secondo fonti diplomatiche, il vertice si terrebbe a giugno. Le sanzioni sarebbero state già approvate. L’accordo sarebbe vicino, stando alle indiscrezioni.", ["Quand aurait lieu le sommet ?", ["En juin", "En mai", "Jamais"], 0], ["Que dit-on des sanctions ?", ["Approuvées, selon les sources", "Refusées", "Inconnues"], 0]], "l": ["La tregua sarebbe stata violata, ma non c’è conferma. L’alleanza starebbe cercando una soluzione.", ["Qu’est-ce qui aurait été violé ?", ["La trêve", "L’accord", "La frontière"], 0], ["La nouvelle est…", ["Non confirmée", "Confirmée", "Fausse"], 0]], "w": ["Écrivez 3 phrases au conditionnel journalistique.", ["sarebbe", "avrebbe", "secondo"], "Secondo fonti, il ministro si sarebbe dimesso. Il vertice si terrebbe a luglio. L’accordo sarebbe vicino."], "s": ["Rapportez une rumeur.", "Secondo fonti, il vertice si terrebbe a giugno."]}, {"t": "Histoire & mémoire", "v": [["La memoria storica", "La mémoire historique"], ["Il dopoguerra", "L’après-guerre"], ["La resistenza", "La résistance"], ["L’unificazione", "L’unification"], ["Il ventennio", "Les vingt ans (fascisme)"], ["La ricostruzione", "La reconstruction"], ["Il boom economico", "Le boom économique"], ["La testimonianza", "Le témoignage"], ["L’archivio", "Les archives"], ["Commemorare", "Commémorer"]], "g": ["Dislocation et mise en relief", ""], "r": ["La ricostruzione, l’hanno fatta in pochi anni. Il boom economico, lo ricordano tutti. Quanto agli archivi, li conservano a Roma. È proprio la memoria che va difesa.", ["Qui a reconstruit ?", ["Ils, en peu d’années", "Les touristes", "Personne"], 0], ["Où sont les archives ?", ["À Rome", "À Milan", "À Paris"], 0]], "l": ["La testimonianza, la ascoltiamo ogni anno. È stato nel dopoguerra che tutto è cambiato.", ["Quand écoute-t-on le témoignage ?", ["Chaque année", "Une fois", "Jamais"], 0], ["Quand tout a-t-il changé ?", ["Après-guerre", "Avant", "Hier"], 0]], "w": ["Écrivez 3 phrases avec dislocation.", ["lo", "la", "è … che"], "Il libro, l’ho letto. La storia, la conosco. È stato ieri che è successo."], "s": ["Mettez un mot en relief.", "Il libro, l’ho letto ieri."]}, {"t": "Cinéma & musique", "v": [["Il regista", "Le réalisateur"], ["La colonna sonora", "La bande originale"], ["La sceneggiatura", "Le scénario"], ["Il montaggio", "Le montage"], ["L’inquadratura", "Le plan"], ["L’opera lirica", "L’opéra"], ["Il direttore d’orchestra", "Le chef d’orchestre"], ["L’aria", "L’air"], ["Il debutto", "Les débuts"], ["La critica", "La critique"]], "g": ["La concordance au subjonctif", ""], "r": ["Credevo che il regista avesse scelto un’altra colonna sonora. Pensavo che la critica fosse severa, ma sembra che la sceneggiatura abbia convinto. Se il montaggio fosse stato diverso, il film sarebbe riuscito meglio.", ["Qu’a-t-on cru du réalisateur ?", ["Autre bande son", "Autre scénario", "Autre acteur"], 0], ["Qu’a convaincu ?", ["Le scénario", "Le montage", "Le débuts"], 0]], "l": ["Temevo che l’opera non piacesse. Sembra che il direttore abbia ottenuto un grande successo al debutto.", ["Que craignait-on ?", ["L’opéra déplaire", "Le retard", "Le prix"], 0], ["Qui a eu du succès ?", ["Le chef", "Le chanteur", "Le metteur en scène"], 0]], "w": ["Écrivez 3 phrases avec concordance.", ["credevo che", "sembra che", "temevo che"], "Credevo che fosse tardi. Sembra che abbia vinto. Temevo che non venisse."], "s": ["Exprimez une croyance passée.", "Credevo che il film fosse migliore."]}, {"t": "Bilan C2 : synthèse", "v": [["In ultima analisi", "En dernière analyse"], ["A rigor di logica", "À la rigueur de la logique"], ["Ad abundantiam", "Surabondamment"], ["Di fatto", "De fait"], ["Né più né meno", "Ni plus ni moins"], ["Per contro", "En revanche"], ["A maggior ragione", "À plus forte raison"], ["Tutto sommato", "Tout bien considéré"], ["Beninteso", "Bien entendu"], ["Vale a dire", "C’est-à-dire"]], "g": ["Synthèse des structures C2", ""], "r": ["In ultima analisi, il problema è di metodo. Tutto sommato, i risultati sono buoni; per contro, i costi restano alti. A maggior ragione, serve prudenza, vale a dire verificare tutto.", ["Quel est le problème ?", ["La méthode", "Le budget", "Le temps"], 0], ["Que faut-il faire ?", ["Vérifier tout", "Ignorer", "Attendre"], 0]], "l": ["Beninteso, nessuno lo nega. Di fatto, la situazione è migliorata. Tutto sommato, direi che va bene.", ["Que dit-on de la situation ?", ["Elle s’est améliorée", "Elle empire", "Elle est stable"], 0], ["Conclusion ?", ["Ça va bien", "Ça va mal", "Aucune"], 0]], "w": ["Rédigez une synthèse (3 phrases).", ["in ultima analisi", "tutto sommato", "per contro"], "In ultima analisi, il progetto funziona. Tutto sommato, è positivo. Per contro, costa molto."], "s": ["Concluez avec nuance.", "Tutto sommato, direi che va bene."]}]}];

<script>
window.XPATCH3=[["B1", 0, {"r": [["Quando ero piccola, passavo le estati dai nonni in campagna. Ogni mattina giocavo nel giardino e la sera mangiavamo tutti insieme. Un giorno, mentre correvo, sono caduta e mi sono rotta il braccio.", ["Où passait-elle ses étés ?", ["Chez ses grands-parents", "À la mer", "En ville"], 0], ["Que faisait-elle chaque matin ?", ["Elle jouait au jardin", "Elle étudiait", "Elle dormait"], 0], ["Que s’est-il passé un jour ?", ["Elle s’est cassé le bras", "Elle s’est perdue", "Elle a gagné"], 0]], ["Ieri sera pioveva e faceva freddo. Stavo leggendo quando è saltata la luce. Ho acceso una candela e ho finito il capitolo.", ["Quel temps faisait-il ?", ["Pluie et froid", "Soleil", "Neige"], 0], ["Que s’est-il passé ?", ["Coupure de courant", "Un appel", "Une visite"], 0]]], "l": [["Da bambino abitavo in una piccola città. Ogni domenica andavo al mercato con mio padre e compravamo il pane fresco.", ["Quand allait-il au marché ?", ["Le dimanche", "Le lundi", "Le samedi"], 0], ["Avec qui ?", ["Son père", "Sa mère", "Son frère"], 0]], ["Mentre aspettavo l’autobus, ho incontrato un vecchio amico. Non lo vedevo da anni e abbiamo parlato per un’ora.", ["Que faisait-il ?", ["Il attendait le bus", "Il courait", "Il dormait"], 0], ["Combien de temps ont-ils parlé ?", ["Une heure", "Dix minutes", "Un jour"], 0]]], "w": [["Racontez un souvenir d’enfance (imparfait + passé composé).", ["ero", "mentre", "un giorno"], "Quando ero piccola abitavo in campagna. Un giorno, mentre giocavo, ho trovato un gattino. L’ho portato a casa."]], "s": [["Parlez d’un souvenir d’enfance.", "Quando ero piccola, andavo spesso al mare con i miei nonni."]], "ex": [["Mentre mangiavo, è arrivato Luca.", "Pendant que je mangeais, Luca est arrivé."], ["Da piccolo giocavo sempre fuori.", "Petit, je jouais toujours dehors."], ["Faceva freddo e pioveva.", "Il faisait froid et il pleuvait."]]}], ["B1", 1, {"r": [["Se potessi, comprerei una casa in montagna. Passerei lì le vacanze e legge <script>
window.XPATCH4=[["B2", 0, {"r": [["Penso che sia importante che i giovani votino. Benché molti non si interessino di politica, è necessario che capiscano le decisioni che li riguardano. Affinché possano scegliere bene, serve un’informazione chiara.", ["Que pense l’auteur ?", ["Les jeunes doivent voter", "Les jeunes ne doivent pas voter", "Le vote est inutile"], 0], ["Qu’est-il nécessaire que les jeunes comprennent ?", ["Les décisions qui les concernent", "Les lois fiscales", "L’histoire"], 0], ["Qu’est-ce qui aide à bien choisir ?", ["Une information claire", "Plus de publicité", "Un vote obligatoire"], 0]], ["Sembra che il governo voglia ridurre le tasse, ma gli esperti dubitano che sia possibile. È probabile che il debito aumenti, a meno che non si trovino nuove entrate. Speriamo che qualcosa cambi.", ["Que veut le gouvernement ?", ["Réduire les impôts", "Augmenter les impôts", "Créer des emplois"], 0], ["Que pensent les experts ?", ["Ils doutent", "Ils approuvent", "Ils sont indifférents"], 0], ["Dette ?", ["Elle pourrait augmenter", "Elle va disparaître", "Elle est stable"], 0]]], "l": [["Voglio che tu venga con me, anche se non sei d’accordo. Credo che sia la scelta migliore per tutti.", ["Que veut le locuteur ?", ["Que l’autre vienne", "Qu’il reste", "Qu’il parte seul"], 0], ["Que pense-t-il ?", ["C’est le meilleur choix", "C’est un risque", "C’est inutile"], 0]], ["Prima che arrivi il capo, dobbiamo finire. Nonostante sia stanco, farò un ultimo sforzo.", ["Quand finir ?", ["Avant l’arrivée du chef", "Après", "Jamais"], 0], ["État du locuteur ?", ["Fatigué", "Joyeux", "Énervé"], 0]]], "w": [["Donnez votre avis sur le télétravail (congiuntivo).", ["penso che", "benché", "sia"], "Penso che il telelavoro sia utile, benché non tutti lo preferiscano. È necessario che le aziende offrano flessibilità."]], "s": [["Exprimez un doute.", "Dubito che il progetto sia pronto entro venerdì."]], "ex": [["Voglio che tu venga.", "Je veux que tu viennes."], ["Sembra che piova.", "Il semble qu’il pleuve."], ["Dubito che sia vero.", "Je doute que ce soit vrai."]]}], ["B2", 1, {"r": [["Se avessi più tempo, imparerei il pianoforte. Se avessi iniziato da giovane, oggi suonerei bene. Qualora trovassi un buon maestro, comincerei subito, a condizione che le lezioni non costino troppo.", ["Que ferait-il avec plus de temps ?", ["Apprendre le piano", "Voyager", "Changer de métier"], 0], ["Si commencé jeune ?", ["Il jouerait bien aujourd’hui", "Il serait célèbre", "Il aurait arrêté"], 0], ["Condition ?", ["Que les cours ne soient pas chers", "Un piano", "Du temps libre"], 0]], ["Se non ci fosse stato lo sciopero, saremmo arrivati in orario. Di conseguenza abbiamo perso la coincidenza. Avremmo dovuto partire prima, nonostante il maltempo.", ["Pourquoi le retard ?", ["La grève", "La météo", "Une panne"], 0], ["Conséquence ?", ["Correspondance ratée", "Annulation", "Rien"], 0]]], "l": [["Se fossi in te, accetterei l’offerta. Ma se tu rifiutassi, dovresti avere buoni motivi.", ["Conseil ?", ["Accepter", "Refuser", "Attendre"], 0], ["Condition du refus ?", ["De bonnes raisons", "Du temps", "Un avocat"], 0]], ["Se avessi studiato, avrei superato l’esame. Ormai non posso più cambiare nulla.", ["Résultat ?", ["Il a échoué", "Il a réussi", "Il a abandonné"], 0], ["Possibilité de changer ?", ["Non", "Oui", "Peut-être"], 0]]], "w": [["Écrivez 3 phrases hypothétiques sur un voyage.", ["se avessi", "se fossi", "viaggerei"], "Se avessi più tempo, viaggerei di più. Se fossi ricca, andrei in Giappone. Se avessi prenotato prima, avrei risparmiato."]], "s": [["Dites ce que vous feriez avec un million.", "Se vincessi un milione, comprerei una casa e viaggerei."]], "ex": [["Se potessi, partirei.", "Si je pouvais, je partirais."], ["Se avessi saputo, sarei venuto.", "Si j’avais su, je serais venu."], ["Qualora piovesse, resteremmo.", "S’il pleuvait, nous resterions."]]}], ["B2", 2, {"r": [["La nuova legge è stata approvata ieri dal Parlamento. Il testo verrà pubblicato do , "Ne parlait pas"], 0], ["Qu’a-t-il fait ?", ["Il a répondu comme s’il avait étudié", "Il est resté silencieux", "Il a ri"], 0]]], "l": [["Credevo che fosse tardi, invece era presto. Pensavo che tu avessi già mangiato.", ["Que croyait-il ?", ["Qu’il était tard", "Qu’il était tôt", "Qu’il pleuvait"], 0], ["Réalité ?", ["Il était tôt", "Il était tard", "Il pleuvait"], 0]], ["Voleva che tutti lo ascoltassero. Parlava come se fosse il capo, ma nessuno lo prendeva sul serio.", ["Que voulait-il ?", ["Qu’on l’écoute", "Qu’on parte", "Qu’on rie"], 0], ["Comment parlait-il ?", ["Comme s’il était chef", "Comme un enfant", "À voix basse"], 0]]], "w": [["Racontez ce que vous pensiez enfant (congiuntivo imperfetto).", ["pensavo che", "volevo che", "come se"], "Pensavo che i grandi sapessero tutto. Volevo che mi leggessero storie. Parlavo come se fossi già grande."]], "s": [["Parlez d’un souhait d’enfance.", "Da piccola volevo che i miei genitori mi comprassero un cane."]], "ex": [["Pensavo che fosse tardi.", "Je pensais qu’il était tard."], ["Volevo che venissi.", "Je voulais que tu viennes."], ["Parla come se fosse esperto.", "Il parle comme s’il était expert."]]}], ["B2", 7, {"r": [["Credo che sia già arrivato. Temevo che fosse partito senza avvisare. Sembra che abbia chiamato più volte, ma nessuno ha risposto. Se avessi saputo, sarei andato io.", ["Que croit-il ?", ["Qu’il est déjà arrivé", "Qu’il est parti", "Qu’il dort"], 0], ["Qu’a-t-il fait ?", ["Appelé plusieurs fois", "Écrit", "Rien"], 0], ["Regret ?", ["Ne pas être allé lui-même", "Avoir parlé", "Être resté"], 0]], ["Dubito che abbiano capito. Pensavo che avessero letto il rapporto, ma non sembra che l’abbiano aperto. Benché fosse urgente, nessuno si è mosso.", ["Qu’en doute-t-il ?", ["Qu’ils aient compris", "Qu’ils partent", "Qu’ils aient mangé"], 0], ["Le rapport…", ["N’a pas été ouvert", "A été lu", "A été perdu"], 0]]], "l": [["Spero che sia stato un malinteso. Pensavo che avessi già pagato.", ["Qu’espère-t-il ?", n aussi ?", ["Des petits livres illustrés", "Des vêtements", "Des plantes"], 0], ["Qui a fait un film ?", ["Le réalisateur", "Le directeur", "Le guide"], 0]], ["Che bel librone! E che casona! Quel ragazzaccio ha rotto il vasetto del salotto. Mamma mia, che figuraccia!", ["Le livre est…", ["Gros", "Petit", "Neuf"], 0], ["Ce qu’on dit du garçon ?", ["Il est méchant", "Il est sage", "Il est drôle"], 0]]], "l": [["Ho comprato un quadretto per il mio studio. È piccolino ma molto carino. Costa pochino.", ["Qu’a-t-il acheté ?", ["Un petit tableau", "Un grand tableau", "Une photo"], 0], ["Prix ?", ["Très peu", "Cher", "Gratuit"], 0]], ["Che stanzone! E che portone! Il palazzo è enorme, ma il giardinetto è minuscolo.", ["Le palais est…", ["Énorme", "Petit", "Neuf"], 0], ["Le jardin est…", ["Minuscule", "Immense", "Vide"], 0]]], "w": [["Décrivez un lieu avec 3 suffixes (-ino, -one, -accio).", ["-ino", "-one", "-accio"], "Che bella casetta! Il salotto è un salone. Ma il tempo è bruttaccio."]], "s": [["Décrivez un objet avec un diminutif.", "Ho comprato un tavolino piccolo ma molto carino."]], "ex": [["È un bel libretto.", "C’est un joli petit livre."], ["Che casona!", "Quelle grande maison !"], ["Che tempaccio!", "Quel sale temps !"]]}], ["B2", 15, {"r": [["Ho fatto riparare la macchina da un meccanico. Mi sono fatta tagliare i capelli e ho fatto stampare i documenti. Lascia che i bambini giochino: non li faccio smettere.", ["Qu’a-t-il fait réparer ?", ["La voiture", "Le téléphone", "La maison"], 0], ["Que s’est-elle fait faire ?", ["Couper les cheveux", "Un massage", "Une photo"], 0], ["Attitude envers les enfants ?", ["Elle les laisse jouer", "Elle les gronde", "Elle les couche"], 0]], ["Il capo mi ha fatto lavorare tutto il fine settimana. Mi ha fatto compilare i moduli e non mi ha lasciato uscire. Domani mi farò dare un giorno libero.", ["Qu’a-t-il fait faire ?", ["Travailler le week-end", "Voyager", "Étudier"], 0], ["Demain ?", ["Il se fera donner un jour de repos", "Il démissionne", "Il part"], 0]]], "l": [["Faccio sempre pulire la casa a una signora. Mi sono fatto fare una copia delle chiavi.", ["Qui nettoie ?", ["Une dame", "Lui", "Un ami"], 0], ["Qu’a-t-il fait faire ?", ["Une copie des clés", "Une photo", "Un gâteau"], 0]], ["Lasciami finire! Non mi far ridere! Fammi sapere quando arrivi.", ["Que demande-t-il ?", ["Qu’on le laisse finir", "Qu’on parte", "Qu’on rie"], 0], ["Que veut-il savoir ?", ["Quand l’autre arrive", "Où il est", "Pourquoi"], 0]]], "w": [["Écrivez 3 phrases avec far fare / farsi fare.", ["ho fatto", "mi sono fatto", "lascia"], "Ho fatto riparare la bici. Mi sono fatta tagliare i capelli. Lascia che finisca."]], "s": [["Dites ce que vous avez fait réparer.", "Ho fatto riparare il telefono da un tecnico."]], "ex": [["Faccio riparare la macchina.", "Je fais réparer la voiture."], ["Mi faccio tagliare i capelli.", "Je me fais couper les cheveux."], ["Lasciami parlare.", "Laisse-moi parler."]]}], ["B2", 16, {"r": [["Ho visto Marco uscire di casa e l’ho sentito chiudere la porta. Ho notato che aveva fretta: lo guardavo correre verso la stazione. Mi sono accorto che portava una valigia.", ["Qu’a-t-il vu ?", ["Marco sortir", "Marco entrer", "Marco dormir"], 0], ["Pourquoi remarquer ?", ["Marco avait de la hâte", "Il était lent", "Il chantait"], 0], ["Marco portait…", ["Une valise", "Un sac", "Rien"], 0]], ["Abbiamo ascoltato i bambini cantare e abbiamo sentito la musica salire dal cortile. Ho visto che stavano ballando.", ["Qu’a-t-on écouté ?", ["Les enfants chanter", "Un concert", "La radio"], 0], ["Que faisaient-ils ?", ["Ils dansaient", "Ils dormaient", "Ils mangeaient"], 0]]], "l": [["Ho sentito squillare il telefono, ma non ho visto chi chiamava. Ho notato un numero sconosciuto.", ["Qu’a-t-il entendu ?", ["Le téléphone sonner", "Un cri", "Une porte"], 0], ["Numéro ?", ["Inconnu", "Connu", "Caché"], 0]], ["L’ho visto entrare ma non l’ho sentito parlare. Mi sono accorta che era stanco.", ["L’a-t-elle entendu parler ?", ["Non", "Oui", "Un peu"], 0], ["Elle a remarqué qu’il était…", ["Fatigué", "Joyeux", "Malade"], 0]]], "w": [["Décrivez ce que vous voyez par la fenêtre.", ["vedo", "sento", "guardo"], "Vedo i bambini giocare. Sento il vento soffiare. Guardo la gente passare."]], "s": [["Dites ce que vous entendez en ce moment.", "Sento i bambini giocare nel cortile."]], "ex": [["Vedo Marco correre.", "Je vois Marco courir."], ["Ho sentito suonare il campanello.", "J’ai entendu sonner à la porte."], ["Ho notato che era triste.", "J’ai remarqué qu’il était triste."]]}], ["B2", 17, {"r": [["È proprio lui che ha chiamato! Non sono io che ho sbagliato, è stato Marco. È lì che ci siamo conosciuti, ed è allora che ho capito tutto.", ["Qui a appelé ?", ["Lui", "Elle", "Marco"], 0], ["Où se sont-ils connus ?", ["Là", "Au bar", "À l’école"], 0], ["Quand a-t-il compris ?", ["Alors", "Hier", "Jamais"], 0]], ["Sono i giovani che cambiano il mondo. Non è la fretta che serve, ma la pazienza. È proprio questo che volevo dire.", ["Qui change le monde ?", ["Les jeunes", "Les vieux", "Les artistes"], 0], ["Qu’est-ce qui sert ?", ["La patience", "La hâte", "L’argent"], 0]]], "l": [["Sono io che pago oggi. È a Roma che ho studiato, non a Milano.", ["Qui paie ?", ["Le locuteur", "L’autre", "Personne"], 0], ["Où a-t-il étudié ?", ["Rome", "Milan", "Naples"], 0]], ["È solo adesso che capisco. Non sei tu che hai sbagliato, è il sistema.", ["Quand comprend-il ?", ["Maintenant", "Hier", "Jamais"], 0], ["Qui est en tort ?", ["Le système", "L’autre", "Le locuteur"], 0]]], "w": [["Mettez en relief 3 éléments (è… che).", ["è proprio", "sono io che", "è lì che"], "È proprio lui che ha vinto. Sono io che pago. È lì che ci siamo incontrati."]], "s": [["Corrigez une erreur avec une mise en relief.", "Non sono io che ho sbagliato, è stato lui."]], "ex": [["Sono io che pago.", "C’est moi qui paie."], ["È lì che abito.", "C’est là que j’habite."], ["Non è lui che ha chiamato.", "Ce n’est pas lui qui a appelé."]]}], ["B2", 18, {"r": [["In questa città ci si alza presto e ci si diverte molto la sera. Ci si abitua facilmente al ritmo di vita. Ci si sente a casa dopo pochi giorni.", ["Quand se lève-t-on ?", ["Tôt", "Tard", "À midi"], 0], ["S’habitue-t-on facilement ?", ["Oui", "Non", "Difficilement"], 0], ["On se sent chez soi…", ["Après quelques jours", "Après un an", "Jamais"], 0]], ["Quando si è giovani, ci si preoccupa meno. Ci si è sempre divertiti molto, ma ci si è anche annoiati. Ci si riposa solo in vacanza.", ["Quand s’inquiète-t-on moins ?", ["Quand on est jeune", "Quand on est vieux", "Jamais"], 0], ["Quand se repose-t-on ?", ["En vacances", "Toujours", "Jamais"], 0]]], "l": [["Ci si vede domani al bar. Ci si ritrova sempre lì dopo il lavoro.", ["Quand se voit-on ?", ["Demain", "Hier", "Aujourd’hui"], 0], ["Où ?", ["Au bar", "Au parc", "Au cinéma"], 0]], ["Ci si sente stanchi dopo una lunga giornata. Quando si è stanchi, ci si addormenta subito.", ["Fatigue après…", ["Une longue journée", "Un repas", "Un film"], 0], ["Que fait-on ?", ["On s’endort vite", "On lit", "On court"], 0]]], "w": [["Décrivez la vie dans votre ville (ci si).", ["ci si", "si è", "ci si sente"], "Qui ci si alza presto. Ci si sente bene. Quando si è stanchi, ci si riposa."]], "s": [["Dites ce qu’on fait dans votre région.", "Nella mia regione ci si diverte molto e ci si sente a casa."]], "ex": [["Ci si abitua a tutto.", "On s’habitue à tout."], ["Ci si alza presto.", "On se lève tôt."], ["Quando si è giovani, ci si diverte.", "Quand on est jeune, on s’amuse."]]}], ["B2", 19, {"r": [["Se avessi scelto un altro lavoro, oggi vivrei in un’altra città. A volte rimpiango di non aver viaggiato di più. Ormai ho una famiglia e una casa, e non cambierei nulla.", ["Que regrette-t-il parfois ?", ["Ne pas avoir voyagé", "Ses études", "Son mariage"], 0], ["Où vivrait-il ?", ["Dans une autre ville", "À la campagne", "À l’étranger"], 0], ["Aujourd’hui ?", ["Il ne changerait rien", "Il veut partir", "Il est triste"], 0]], ["Sono arrivata a un bivio: restare nella mia città o partire. Se fossi più coraggiosa, accetterei il lavoro all’estero. Però se partissi, mi mancherebbe la famiglia.", ["Dilemme ?", ["Rester ou partir", "Étudier ou travailler", "Marier ou non"], 0], ["Si elle partait ?", ["La famille lui manquerait", "Elle serait heureuse", "Elle oublierait"], 0]]], "l": [["Se non avessi incontrato Marco, non mi sarei trasferito qui. Ora ho una nuova vita.", ["Pourquoi a-t-il déménagé ?", ["Il a rencontré Marco", "Un travail", "La famille"], 0], ["Aujourd’hui ?", ["Une nouvelle vie", "Il regrette", "Il retourne"], 0]], ["Vorrei che il tempo si fermasse. Se potessi tornare indietro, rifarei le stesse scelte.", ["Souhait ?", ["Que le temps s’arrête", "Que le temps passe", "Voyager"], 0], ["S’il pouvait revenir ?", ["Mêmes choix", "D’autres", "Rien"], 0]]], "w": [["Parlez d’une décision de vie et de ses conséquences.", ["se avessi", "oggi", "rimpiango"], "Se avessi studiato arte, oggi lavorerei in un museo. Non rimpiango la mia scelta. Ho una vita serena."]], "s": [["Dites un choix que vous referiez.", "Se potessi tornare indietro, rifarei la stessa scelta."]], "ex": [["Se fossi nato a Roma, parlerei meglio.", "Si j’étais né à Rome, je parlerais mieux."], ["Rimpiango di non aver studiato.", "Je regrette de ne pas avoir étudié."], ["Vorrei che fosse vero.", "Je voudrais que ce soit vrai."]]}], ["B2", 20, {"r": [["— Dai, vieni con noi! — Mah, non so... — Insomma, decidi! — Boh, magari più tardi. — Eh già, come sempre! Cioè, non fa niente, ci vediamo dopo.", ["Que lui propose-t-on ?", ["De venir", "De partir", "De payer"], 0], ["Il répond…", ["Je ne sais pas", "Oui tout de suite", "Non"], 0], ["À la fin ?", ["On se verra plus tard", "Il vient", "Il part"], 0]], ["Allora, come va? — Mah, tiriamo avanti. — Che figata la tua nuova casa! — Eh sì, però costa un occhio. — Pazienza, ne vale la pena.", ["Comment va-t-il ?", ["On tire", "Très bien", "Très mal"], 0], ["La maison coûte…", ["Cher", "Peu", "Rien"], 0]]], "l": [["Eh già, hai ragione. Ma insomma, che facciamo? Dai, andiamo a mangiare.", ["Que propose-t-il ?", ["Aller manger", "Rentrer", "Dormir"], 0], ["Début de phrase ?", ["Il approuve", "Il refuse", "Il crie"], 0]], ["Cioè, non è che non mi piaccia, è che boh... non mi convince.", ["Il aime ?", ["Pas vraiment", "Beaucoup", "Il adore"], 0], ["Ton ?", ["Hésitant", "Joyeux", "En colère"], 0]]], "w": [["Écrivez un petit dialogue familier avec 4 interjections.", ["dai", "mah", "insomma"], "— Dai, vieni! — Mah, non so. — Insomma, decidi! — Boh, forse."]], "s": [["Hésitez comme un Italien.", "Mah, non so... insomma, forse vengo più tardi."]], "ex": [["Dai, andiamo!", "Allez, on y va !"], ["Boh, non lo so.", "Bof, je ne sais pas."], ["Cioè, non è vero.", "C’est-à-dire, ce n’est pas vrai."]]}], ["B2", 21, {"r": [["Il bagno? Lo pulisco ogni sabato. Le camicie le stiro la domenica sera. I piatti li lavo subito, ma la spesa la faccio il giovedì. Ne compro sempre troppa e ne butto un po’.", ["Quand nettoie-t-il la salle de bains ?", ["Chaque samedi", "Chaque dimanche", "Jamais"], 0], ["Quand repasse-t-il ?", ["Dimanche soir", "Samedi", "Lundi"], 0], ["Les courses ?", ["Le jeudi", "Le lundi", "Le week-end"], 0]], ["Mi lavi la macchina? — Te la lavo domani. — E mi stiri la camicia? — Te la stiro stasera. — Grazie, mi aiuti molto!", ["Que demande-t-il ?", ["De laver la voiture", "De cuisiner", "De courir"], 0], ["Quand la chemise ?", ["Ce soir", "Demain", "Hier"], 0]]], "l": [["Le chiavi? Le ripongo nel cassetto. I vestiti li metto nell’armadio. La spesa la porto in cucina.", ["Où met-il les clés ?", ["Dans le tiroir", "Dans l’armoire", "Sur la table"], 0], ["Où met-il les vêtements ?", ["Dans l’armoire", "Dans le tiroir", "Dans la cuisine"], 0]], ["Hai buttato la spazzatura? — Sì, l’ho buttata stamattina. — E i piatti? — Li ho già lavati.", ["Poubelle ?", ["Jetée ce matin", "Pas jetée", "Demain"], 0], ["Vaisselle ?", ["Déjà lavée", "Pas lavée", "À faire"], 0]]], "w": [["Décrivez vos tâches ménagères avec des pronoms.", ["lo", "la", "li"], "Il bagno lo pulisco il sabato. La cucina la lavo ogni sera. I vestiti li stiro la domenica."]], "s": [["Dites qui fait la cuisine chez vous.", "La cucina la faccio io, ma i piatti li lava lui."]], "ex": [["La spesa la faccio io.", "Les courses, c’est moi qui les fais."], ["Li lavo domani.", "Je les lave demain."], ["Te la stiro stasera.", "Je te la repasse ce soir."]]}], ["B2", 22, {"r": [["Secondo fonti vicine al governo, il ministro si sarebbe dimesso. Pare che l’annuncio sia imminente, ma nessuno lo conferma. Si dice che ci siano disaccordi sulla riforma.", ["Selon qui ?", ["Sources proches du gouvernement", "Le ministre", "Un journal"], 0], ["Statut de l’info ?", ["Non confirmée", "Confirmée", "Officielle"], 0], ["Cause évoquée ?", ["Désaccords sur la réforme", "Santé", "Scandale"], 0]], ["L’azienda avrebbe chiuso lo stabilimento di Torino. Il portavoce smentisce: nessuna chiusura prevista. Stando alle voci, i sindacati avrebbero già ricevuto una lettera.", ["Rumeur ?", ["Fermeture d’une usine", "Embauches", "Fusion"], 0], ["Réaction du porte-parole ?", ["Il dément", "Il confirme", "Il se tait"], 0]]], "l": [["Il presidente avrebbe lasciato la città. Pare che sia partito per un viaggio privato.", ["Qui aurait quitté la ville ?", ["Le président", "Le ministre", "Le maire"], 0], ["Motif ?", ["Voyage privé", "Maladie", "Travail"], 0]], ["Si dice che l’accordo sia vicino. Ma fonti diplomatiche avrebbero smentito.", ["L’accord est…", ["Proche selon la rumeur", "Signé", "Annulé"], 0], ["Sources diplomatiques ?", ["Démentent", "Confirment", "Sont muettes"], 0]]], "w": [["Rapportez une rumeur au conditionnel journalistique.", ["sarebbe", "secondo fonti", "pare che"], "Secondo fonti, il ministro sarebbe dimesso. Pare che l’accordo sia vicino. Nulla è confermato."]], "s": [["Annoncez une information non confirmée.", "Secondo fonti non ufficiali, il vertice sarebbe rinviato."]], "ex": [["Il ministro si sarebbe dimesso.", "Le ministre aurait démissionné."], ["Pare che sia vero.", "Il paraît que c’est vrai."], ["Si dice che parta domani.", "On dit qu’il part demain."]]}], ["B2", 23, {"r": [["Il progetto va consegnato entro il 30 giugno. Durante il mese di maggio faremo le prime verifiche, e fino a giugno lavoreremo ogni giorno. Verso metà mese ci sarà una riunione intermedia.", ["Date limite ?", ["30 juin", "30 mai", "15 juin"], 0], ["Période de vérifications ?", ["Mai", "Juin", "Juillet"], 0], ["Réunion ?", ["Mi-mois", "Fin du mois", "Début"], 0]], ["Il corso va dal 10 al 28 settembre. Si studia da lunedì a venerdì, dalle nove alle tredici. Tra una lezione e l’altra c’è una pausa di dieci minuti. Nel corso della settimana ci sono due verifiche.", ["Dates du cours ?", ["Du 10 au 28 septembre", "Du 1 au 15", "En octobre"], 0], ["Pause ?", ["Dix minutes", "Une heure", "Aucune"], 0]]], "l": [["Entro venerdì dobbiamo consegnare tutto. Dalla prossima settimana lavoreremo da casa fino a nuovo avviso.", ["Échéance ?", ["Vendredi", "Lundi", "Demain"], 0], ["À partir de la semaine prochaine ?", ["Télétravail", "Vacances", "Voyage"], 0]], ["Fra due settimane parto. Starò via per tre mesi, da gennaio a marzo.", ["Départ ?", ["Dans deux semaines", "Demain", "Dans un mois"], 0], ["Durée ?", ["Trois mois", "Un mois", "Un an"], 0]]], "w": [["Écrivez un planning (entro, durante, da… a).", ["entro", "durante", "da"], "Entro lunedì finisco il rapporto. Durante la settimana preparo la presentazione. Da martedì a giovedì sono in riunione."]], "s": [["Présentez vos échéances de la semaine.", "Entro mercoledì devo consegnare il progetto."]], "ex": [["Consegno entro venerdì.", "Je rends avant vendredi."], ["Lavoro da lunedì a venerdì.", "Je travaille du lundi au vendredi."], ["Parto fra una settimana.", "Je pars dans une semaine."]]}], ["B2", 24, {"r": [["Accetto la proposta a condizione che mi diate più tempo. Purché il contratto sia chiaro, firmo domani. Prima che sia troppo tardi, vorrei chiarire un punto: a meno che non ci siano cambiamenti, non posso accettare.", ["Condition principale ?", ["Plus de temps", "Plus d’argent", "Un avocat"], 0], ["Quand signera-t-il ?", ["Demain si clair", "Aujourd’hui", "Jamais"], 0], ["Exception ?", ["S’il y a des changements", "S’il pleut", "S’il part"], 0]], ["Ho parlato con il direttore affinché ci aiuti. Senza che nessuno lo sapesse, ha già preparato un’offerta. Posso accettarla purché sia onesta.", ["Pourquoi parler ?", ["Pour obtenir de l’aide", "Pour démissionner", "Pour critiquer"], 0], ["Condition ?", ["Qu’elle soit honnête", "Qu’elle soit longue", "Qu’elle soit chère"], 0]]], "l": [["Siamo d’accordo, purché il prezzo non cambi. Prima che firmiamo, voglio rileggere tutto.", ["Accord si…", ["Le prix ne change pas", "Il fait beau", "Le délai est long"], 0], ["Avant de signer ?", ["Relire", "Payer", "Partir"], 0]], ["Non firmo a meno che non vengano chiarite le condizioni. Lo dico affinché sia chiaro a tutti.", ["Il ne signe pas…", ["Sans clarifier les conditions", "Sans avocat", "Sans date"], 0], ["Pourquoi le dit-il ?", ["Pour que tout soit clair", "Pour se plaindre", "Pour partir"], 0]]], "w": [["Négociez un contrat (condition, but, exception).", ["purché", "affinché", "a meno che"], "Accetto purché il prezzo sia giusto. Lo dico affinché sia chiaro. Firmo a meno che non ci siano cambiamenti."]], "s": [["Posez une condition à voix haute.", "Accetto l’offerta, purché il contratto sia chiaro."]], "ex": [["Vengo, purché tu venga.", "Je viens, pourvu que tu viennes."], ["Lo dico affinché capisca.", "Je le dis pour qu’il comprenne."], ["Esco, a meno che non piova.", "Je sors, à moins qu’il ne pleuve."]]}]];

<script>
window.XPATCH5=[["C1", 0, {"r": [["Sebbene la proposta fosse ragionevole, il consiglio l’ha respinta. Ciononostante, molti membri hanno sostenuto che andasse approfondita. Giacché i tempi non erano maturi, si è deciso di rinviare la votazione, purché venga garantita maggiore trasparenza.", ["Qu’a fait le conseil ?", ["Rejeté la proposition", "Voté pour", "Démissionné"], 0], ["Que soutiennent beaucoup de membres ?", ["Qu’elle soit approfondie", "Qu’elle soit annulée", "Qu’elle passe vite"], 0], ["Condition du report ?", ["Plus de transparence", "Plus de budget", "Un nouveau chef"], 0]], ["Per quanto la tesi sia suggestiva, mette in luce solo un aspetto del problema. Alquanto lacunosa nelle fonti, sostiene che il fenomeno sia stabile. Eppure i dati recenti indicano il contrario.", ["La thèse est…", ["Séduisante mais partielle", "Parfaite", "Fausse en tout"], 0], ["Les données récentes…", ["Contredisent la thèse", "La confirment", "Sont absentes"], 0]]], "l": [["Benché i risultati siano incoraggianti, non vanno sopravvalutati. Ciononostante, il progetto merita di continuare, a meno che non emergano problemi di sicurezza.", ["Les résultats sont…", ["Encourageants", "Mauvais", "Inconnus"], 0], ["Le projet continue…", ["Sauf problèmes de sécurité", "Quoi qu’il arrive", "Jamais"], 0]], ["Mi ha risposto come se non avesse capito, senza che io avessi detto nulla di complicato. Nondimeno, ho ripetuto con pazienza.", ["Il a répondu comme s’il…", ["N’avait pas compris", "Savait tout", "Était pressé"], 0], ["Réaction du locuteur ?", ["Il a répété patiemment", "Il est parti", "Il s’est fâché"], 0]]], "w": [["Rédigez 3 phrases de concession nuancée (C1).", ["sebbene", "purché", "ciononostante"], "Sebbene il testo sia lungo, è interessante. Lo leggo purché abbia tempo. Ciononostante, resta difficile."]], "s": [["Nuancez une opinion à voix haute.", "Sebbene l’idea sia buona, ciononostante presenta alcuni rischi."]], "ex": [["Esco purché non piova.", "Je sors pourvu qu’il ne pleuve pas."], ["Ciononostante, ha vinto.", "Néanmoins, il a gagné."], ["Giacché è tardi, andiamo.", "Puisqu’il est tard, partons."]]}], ["C1", 1, {"r": [["Avendo letto attentamente il contratto, ho notato alcune clausole ambigue. Pur essendo in vantaggio, la controparte ha accettato di modificarle. Una volta firmato l’accordo, il lavoro è cominciato senza ritardi.", ["Qu’a-t-il remarqué ?", ["Des clauses ambiguës", "Une erreur de date", "Rien"], 0], ["La contrepartie a…", ["Accepté de modifier", "Refusé", "Quitté"], 0], ["Quand le travail commence ?", ["Après la signature", "Avant", "Jamais"], 0]], ["Stando a fonti ufficiali, la riforma sarà approvata entro l’anno. Prendendo spunto da modelli europei, il governo ha riscritto il testo. Nel corso del dibattito, le proposte sono state emendate.", ["Délai ?", ["D’ici l’année", "Dans trois ans", "Jamais"], 0], ["Inspiration ?", ["Modèles européens", "Le passé", "Un référendum"], 0]]], "l": [["Lavorando in ospedale, ho imparato molto. Pur essendo stanco, non ho mai perso la motivazione.", ["Où a-t-il appris ?", ["À l’hôpital", "À l’école", "En voyage"], 0], ["Motivation ?", ["Jamais perdue", "Perdue", "Faible"], 0]], ["Finito il turno, sono tornato a casa. Avendo dimenticato le chiavi, ho dovuto aspettare mia moglie.", ["Que s’est-il passé ?", ["Clés oubliées", "Voiture en panne", "Train raté"], 0], ["Qu’a-t-il dû faire ?", ["Attendre sa femme", "Appeler un taxi", "Casser la porte"], 0]]], "w": [["Écrivez 3 phrases avec gérondif ou participe (C1).", ["avendo", "pur essendo", "una volta"], "Avendo studiato molto, ho superato l’esame. Pur essendo stanco, ho continuato. Una volta finito, sono uscito."]], "s": [["Racontez avec un gérondif passé.", "Avendo finito il lavoro, sono uscito con gli amici."]], "ex": [["Avendo studiato, ho passato.", "Ayant étudié, j’ai réussi."], ["Pur essendo stanco, continuo.", "Tout en étant fatigué, je continue."], ["Una volta finito, ti chiamo.", "Une fois fini, je t’appelle."]]}], ["C1", 2, {"r": [["  "Parler trop est un risque."]]}], ["C1", 12, {"r": [["La notizia è stata smentita dal ministero: la fonte non veniva ritenuta affidabile. L’inchiesta va letta con cautela, perché i dati vanno verificati prima di essere diffusi. L’editoriale viene pubblicato ogni domenica.", ["Qui a démenti ?", ["Le ministère", "Le journal", "Le cronista"], 0], ["Que faut-il faire ?", ["Vérifier les données", "Les diffuser", "Les cacher"], 0], ["L’éditorial paraît…", ["Chaque dimanche", "Chaque lundi", "Chaque jour"], 0]], ["Il comunicato verrà diffuso domani. Le fonti vanno citate sempre, altrimenti l’articolo viene considerato poco serio. Una testata autorevole non diffonde mai notizie non verificate.", ["Quand le communiqué ?", ["Demain", "Aujourd’hui", "Hier"], 0], ["Que faut-il toujours ?", ["Citer les sources", "Changer de titre", "Se taire"], 0]]], "l": [["L’inchiesta è stata condotta da un gruppo di giornalisti. Verrà pubblicata a puntate e sarà seguita da un documentario.", ["Qui l’a menée ?", ["Un groupe de journalistes", "Un ministre", "Un blogueur"], 0], ["Suite ?", ["Un documentaire", "Rien", "Un livre"], 0]], ["Le notizie false vanno smascherate, e le fonti vanno sempre verificate.", ["Que faut-il démasquer ?", ["Les fausses nouvelles", "Les journalistes", "Les titres"], 0], ["Que vérifier ?", ["Les sources", "Les photos", "Les prix"], 0]]], "w": [["Rédigez 3 phrases au passif avec venire/andare.", ["viene", "va", "vengono"], "La notizia viene diffusa oggi. Le fonti vanno verificate. I dati vengono pubblicati."]], "s": [["Dites une règle journalistique.", "Le fonti vanno sempre verificate."]], "ex": [["La notizia viene diffusa.", "La nouvelle est diffusée."], ["I dati vanno verificati.", "Les données doivent être vérifiées."], ["Il comunicato verrà letto.", "Le communiqué sera lu."]]}], ["C1", 13, {"r": [["Per quanto le emissioni siano diminuite, il riscaldamento globale continua. Sebbene le energie rinnovabili crescano, la siccità colpisce molte regioni. Benché sia difficile, la transizione ecologica è inevitabile.", ["Que continue-t-il ?", ["Le réchauffement", "Les émissions", "La pluie"], 0], ["Qui frappe les régions ?", ["La sécheresse", "Le froid", "Les inondations"], 0], ["La transition est…", ["Inévitable", "Impossible", "Terminée"], 0]], ["I ghiacciai si ritirano a un ritmo allarmante. Nonostante gli impegni internazionali, alcuni governi esitano. Per quanto costosa, la sostenibilità conviene a lungo termine.", ["Les glaciers…", ["Reculent", "Grossissent", "Stagnent"], 0], ["La durabilité est…", ["Rentable à long terme", "Inutile", "Gratuite"], 0]]], "l": [["Benché sia tardi, dobbiamo agire. Sebbene i costi siano alti, il danno sarebbe maggiore.", ["Faut-il agir ?", ["Oui", "Non", "Peut-être"], 0], ["Les coûts sont…", ["Élevés mais moindres que le dommage", "Faibles", "Inconnus"], 0]], ["Nonostante la siccità, il raccolto è stato buono. Per quanto strano, è così.", ["Récolte ?", ["Bonne", "Mauvaise", "Nulle"], 0], ["Avis ?", ["Étrange mais réel", "Normal", "Faux"], 0]]], "w": [["Écrivez 3 concessives sur l’environnement.", ["per quanto", "sebbene", "benché"], "Per quanto sia difficile, bisogna agire. Sebbene i costi siano alti, serve cambiare. Benché sia tardi, possiamo ancora intervenire."]], "s": [["Exprimez une concession écologique.", "Per quanto sia difficile, dobbiamo ridurre le emissioni."]], "ex": [["Sebbene piova, esco.", "Bien qu’il pleuve, je sors."], ["Per quanto sia difficile, non mollo.", "Aussi difficile que ce soit, je n’abandonne pas."], ["Nonostante la siccità, il raccolto è buono.", "Malgré la sécheresse, la récolte est bonne."]]}], ["C1", 14, {"r": [["Se il medico avesse spiegato meglio i rischi, il paziente non rifiuterebbe ora le cure. Se rispettassimo di più l’autonomia del paziente, avremmo meno conflitti. Il consenso informato sarebbe stato più chiaro.", ["Que refuse le patient ?", ["Les soins", "Le médecin", "L’examen"], 0], ["Moins de conflits si…", ["On respectait l’autonomie", "On payait plus", "On parlait moins"], 0], ["Consentement…", ["Aurait été plus clair", "Était parfait", "N’existait pas"], 0]], ["Il dilemma etico sorge quando il desiderio del paziente contrasta con il parere medico. Il comitato etico offre un consulto non vincolante. La deontologia richiede riservatezza e rispetto.", ["Origine du dilemme ?", ["Désir du patient vs avis médical", "Le coût", "La loi"], 0], ["Rôle du comité ?", ["Consultation non contraignante", "Décision finale", "Aucun"], 0]]], "l": [["Se avessi saputo dell’effetto collaterale, non avrei accettato. Se la deontologia fosse rispettata sempre, la fiducia sarebbe maggiore.", ["Aurait-il accepté en sachant ?", ["Non", "Oui", "Peut-être"], 0], ["Confiance ?", ["Plus grande si déontologie respectée", "Inchangée", "Nulle"], 0]], ["Il fine vita solleva questioni complesse. Le cure palliative dovrebbero essere accessibili a tutti.", ["Sujet ?", ["La fin de vie", "La naissance", "La greffe"], 0], ["Les soins palliatifs doivent être…", ["Accessibles à tous", "Rares", "Payants"], 0]]], "w": [["Écrivez 3 phrases hypothétiques mixtes.", ["se avessi", "sarei", "avrei"], "Se avessi studiato, sarei più tranquilla. Se fossi partita, avrei visto Roma. Se lo sapessi, l’avrei detto."]], "s": [["Dites un regret.", "Se avessi studiato, ora sarei più tranquilla."]], "ex": [["Se avessi studiato, ora sarei medico.", "Si j’avais étudié, je serais médecin maintenant."], ["Se lo sapessi, l’avrei detto.", "Si je le savais, je l’aurais dit."], ["Se fossi partita, avrei visto Roma.", "Si j’étais partie, j’aurais vu Rome."]]}], ["C1", 15, {"r": [["Facendo un tirocinio ho capito cosa volevo. Lavorando con impegno si ottiene una promozione. Avendo esperienza, potresti chiedere uno stipendio più alto.", ["Que comprend-il ?", ["Ce qu’il veut", "Rien", "Le salaire"], 0], ["Que donne un travail sérieux ?", ["Une promotion", "Un licenciement", "Un stage"], 0], ["Avec de l’expérience ?", ["On peut demander plus", "On perd", "On part"], 0]], ["Candidandomi a tre aziende, ho ricevuto due risposte. Parlando con il responsabile, ho scoperto lo stipendio reale. Pur essendo interessato, ho chiesto più tempo.", ["Combien d’entreprises ?", ["Trois", "Deux", "Cinq"], 0], ["Il a demandé…", ["Plus de temps", "Plus d’argent", "Un congé"], 0]]], "l": [["Lavorando di più avresti successo. Avendo già esperienza, il colloquio è andato bene.", ["Avec plus de travail ?", ["Succès", "Échec", "Stagnation"], 0], ["Entretien ?", ["Bien passé", "Raté", "Annulé"], 0]], ["Dimettendomi, ho perso la sicurezza, ma ho guadagnato libertà.", ["Il a perdu…", ["La sécurité", "La liberté", "La santé"], 0], ["Il a gagné…", ["La liberté", "Un salaire", "Un titre"], 0]]], "w": [["Écrivez 3 phrases avec le gérondif (cause, temps, condition).", ["facendo", "avendo", "lavorando"], "Studiando imparo. Avendo tempo, vengo. Lavorando si guadagna."]], "s": [["Utilisez un gérondif de cause.", "Avendo esperienza, ho trovato lavoro."]], "ex": [["Lavorando si guadagna.", "En travaillant, on gagne."], ["Avendo tempo, vengo.", "Ayant du temps, je viens."], ["Facendo così, rischi molto.", "En faisant ainsi, tu risques beaucoup."]]}], ["C1", 16, {"r": [["In Italia si trovano moltissimi capolavori. Si restaurano le tele con grande cura. Il Rinascimento? Ce ne vengono ricordati i grandi nomi, e ce li hanno insegnati a scuola.", ["Que trouve-t-on en Italie ?", ["Des chefs-d’œuvre", "Peu d’art", "Des galeries"], 0], ["Restauration ?", ["Avec soin", "Vite", "Pas du tout"], 0], ["À l’école ?", ["On enseigne les grands noms", "Rien", "Peu"], 0]], ["La mostra si visita di solito in primavera. Me ne ha parlato un amico, e ce l’ho consigliata anche io. Ce la siamo goduta moltissimo, nonostante la folla.", ["Quand visite-t-on ?", ["Au printemps", "En hiver", "En été"], 0], ["Qui lui en a parlé ?", ["Un ami", "Le musée", "Un prof"], 0]]], "l": [["Si visitano le mostre soprattutto in primavera. Me ne ha parlato un amico.", ["Quand ?", ["Au printemps", "En hiver", "En été"], 0], ["Qui ?", ["Un ami", "Un prof", "Un guide"], 0]], ["Il restauro del quadro è durato due anni. Se lo sono contesi tre musei.", ["Durée ?", ["Deux ans", "Un an", "Dix ans"], 0], ["Combien de musées ?", ["Trois", "Deux", "Cinq"], 0]]], "w": [["Écrivez 3 phrases avec le « si » passif.", ["si vedono", "si trovano", "si può"], "Si vedono molte mostre. Si trovano capolavori. Si può visitare il museo."]], "s": [["Parlez d’une exposition avec « si ».", "Si visitano molte mostre a Roma."]], "ex": [["Si vedono molti quadri.", "On voit beaucoup de tableaux."], ["Me ne ha parlato un amico.", "Un ami m’en a parlé."], ["Ce l’hanno insegnato a scuola.", "Ils nous l’ont appris à l’école."]]}], ["C1", 17, {"r": [["La ricercatrice ha detto che avrebbe pubblicato i risultati. Ha spiegato che l’ipotesi era stata dimostrata e che l’esperimento era riuscito. Ha aggiunto che il finanziamento sarebbe arrivato presto.", ["Que publiera-t-elle ?", ["Les résultats", "Un brevet", "Un livre"], 0], ["L’hypothèse était…", ["Démontrée", "Réfutée", "Inconnue"], 0], ["Financement ?", ["Arrivera bientôt", "Est refusé", "Est retardé"], 0]], ["Lo scienziato ha dichiarato che il brevetto era stato depositato la settimana prima. Ha aggiunto che il progresso non si sarebbe fermato.", ["Brevet ?", ["Déposé la semaine d’avant", "Refusé", "Perdu"], 0], ["Il a ajouté que le progrès…", ["Ne s’arrêterait pas", "S’arrêterait", "Était fini"], 0]]], "l": [["Mi ha detto che stava lavorando a una scoperta e che l’avrebbe presentata il mese dopo.", ["Sur quoi travaillait-elle ?", ["Une découverte", "Un livre", "Un brevet"], 0], ["Quand la présentera-t-elle ?", ["Le mois suivant", "Hier", "Demain"], 0]], ["Ha detto che aveva pubblicato i risultati e che il finanziamento era stato approvato.", ["Résultats ?", ["Publiés", "Perdus", "Cachés"], 0], ["Financement ?", ["Approuvé", "Refusé", "En attente"], 0]]], "w": [["Rapportez 3 phrases au discours indirect.", ["ha detto che", "aveva", "avrebbe"], "Ha detto che avrebbe pubblicato. Ha detto che aveva finito. Ha spiegato che era riuscito."]], "s": [["Rapportez une phrase.", "Ha detto che avrebbe pubblicato i risultati."]], "ex": [["Ha detto che avrebbe pubblicato.", "Elle a dit qu’elle publierait."], ["Ha spiegato che era riuscito.", "Elle a expliqué qu’elle avait réussi."], ["Disse che sarebbe arrivato il giorno dopo.", "Il dit qu’il arriverait le lendemain."]]}], ["C1", 18, {"r": [["Mi fido di lui, ma c’è stato un malinteso. Ci siamo riconciliati dopo aver parlato con calma. La convivenza richiede empatia e compromesso, e ci si abitua a mediare.", ["De qui se fie-t-on ?", ["De lui", "D’elle", "Du voisin"], 0], ["Que demande la cohabitation ?", ["Empathie et compromis", "Argent", "Silence"], 0], ["Comment s’est-on réconcilié ?", ["En parlant calmement", "Par un cadeau", "Par lettre"], 0]], ["Ci siamo accorti del malinteso troppo tardi. Mi sono pentito di aver reagito così, ma ci siamo scusati a vicenda. Ora ci rispettiamo di più.", ["Quand a-t-on remarqué ?", ["Trop tard", "Tout de suite", "Jamais"], 0], ["Résultat ?", ["Plus de respect", "Rupture", "Rien"], 0]]], "l": [["Ci siamo accorti del malinteso troppo tardi. Mi sono pentito di aver reagito così.", ["De quoi s’est-on aperçu ?", ["Du malentendu", "Du retard", "De l’erreur"], 0], ["Qu’a fait le locuteur ?", ["Il s’est repenti", "Il a ri", "Il est parti"], 0]], ["Ci siamo innamorati di questa città. Ci siamo abituati ai ritmi e ci troviamo benissimo.", ["Ils sont tombés amoureux…", ["De la ville", "D’une personne", "D’un livre"], 0], ["Ils se trouvent…", ["Très bien", "Mal", "Étrangers"], 0]]], "w": [["Écrivez 3 phrases avec des verbes pronominaux + préposition.", ["mi fido di", "ci siamo accorti di", "si è pentito di"], "Mi fido di te. Ci siamo accorti dell’errore. Si è pentito di aver parlato."]], "s": [["Dites à qui vous faites confiance.", "Mi fido di lui perché è sincero."]], "ex": [["Mi fido di te.", "J’ai confiance en toi."], ["Ci siamo accorti dell’errore.", "Nous nous sommes aperçus de l’erreur."], ["Si è pentito di aver parlato.", "Il s’est repenti d’avoir parlé."]]}], ["C1", 19, {"r": [["Alla luce dei dati, la tesi sembra solida. Ne consegue che le politiche attuali vanno riviste. A scanso di equivoci, non intendo negare i progressi: il punto cruciale è la loro distribuzione. In definitiva, serve più equità.", ["Que faut-il revoir ?", ["Les politiques actuelles", "Les données", "La thèse"], 0], ["Point crucial ?", ["La distribution des progrès", "Le coût", "Le délai"], 0], ["Conclusion ?", ["Plus d’équité", "Moins de données", "Aucune"], 0]], ["Il controargomento principale riguarda i costi. Tuttavia, dato che i risultati sono chiari, si possono trarre le conclusioni. Vale a dire che conviene intervenire adesso.", ["Contre-argument ?", ["Les coûts", "Le temps", "L’éthique"], 0], ["Conclusion ?", ["Il faut intervenir maintenant", "Il faut attendre", "Rien"], 0]]], "l": [["Dato che i risultati sono chiari, possiamo concludere. Il controargomento principale è però il costo.", ["Peut-on conclure ?", ["Oui", "Non", "Peut-être"], 0], ["Contre-argument ?", ["Le coût", "Le temps", "L’éthique"], 0]], ["In ultima analisi, il problema è di metodo. Beninteso, nessuno lo nega.", ["Problème ?", ["De méthode", "De budget", "De temps"], 0], ["Qui le nie ?", ["Personne", "Tous", "Le chef"], 0]]], "w": [["Rédigez une mini-argumentation (3 phrases).", ["alla luce di", "ne consegue che", "in definitiva"], "Alla luce dei dati, la tesi è valida. Ne consegue che bisogna agire. In definitiva, serve un cambiamento."]], "s": [["Concluez un débat.", "In definitiva, serve più equità."]], "ex": [["Alla luce dei dati, decido.", "À la lumière des données, je décide."], ["Ne consegue che bisogna agire.", "Il s’ensuit qu’il faut agir."], ["In definitiva, serve un cambiamento.", "En définitive, il faut un changement."]]}]];

<script>
window.XPATCH6=[["C2", 0, {"r": [["Dante nacque a Firenze nel 1265 e fu esiliato nel 1302. Scrisse la Commedia durante l’esilio e morì a Ravenna nel 1321. Boccaccio, invece, nacque a Certaldo e compose il Decameron dopo la peste.", ["Où naquit Dante ?", ["Florence", "Ravenne", "Certaldo"], 0], ["Où mourut-il ?", ["Ravenne", "Florence", "Rome"], 0], ["Quand Boccace écrit-il le Décaméron ?", ["Après la peste", "Avant la peste", "Pendant la guerre"], 0]], ["Il narratore aprì la porta, vide la stanza vuota e comprese che era tutto finito. Il suo sguardo cadde sul tavolo, dove trovò una lettera. La lesse, poi la bruciò.", ["Que vit-il ?", ["La pièce vide", "La pièce pleine", "Un fantôme"], 0], ["Sur la table ?", ["Une lettre", "Un livre", "Une clé"], 0], ["Qu’en fit-il ?", ["Il la brûla", "Il la garda", "Il la déchira"], 0]]], "l": [["Il re entrò nella sala, salutò i presenti e parlò a lungo. Nessuno osò interromperlo.", ["Qui entra ?", ["Le roi", "Le soldat", "Le prêtre"], 0], ["Les gens…", ["N’osèrent pas l’interrompre", "Applaudirent", "Partirent"], 0]], ["Nacque povero, studiò con fatica e divenne un grande scrittore. Morì famoso, ma solo.", ["Il naquit…", ["Pauvre", "Riche", "Noble"], 0], ["Il mourut…", ["Célèbre mais seul", "Oublié", "Entouré"], 0]]], "w": [["Racontez en 3 phrases au passato remoto.", ["nacque", "fu", "disse"], "Nacque a Roma nel 1800. Fu un grande poeta. Disse addio alla città e partì."]], "s": [["Racontez brièvement une vie célèbre.", "Dante nacque a Firenze, fu esiliato e morì a Ravenna."]], "ex": [["Dante nacque a Firenze.", "Dante naquit à Florence."], ["Egli disse la verità.", "Il dit la vérité."], ["Andarono via presto.", "Ils partirent tôt."]]}], ["C2", 1, {"r": [["Parla come se fosse un esperto, ma non sa nulla. Qualunque cosa succeda, sostiene che avesse ragione. Chiunque lo contraddica, viene zittito. Se non fosse stato per lui, il progetto sarebbe già finito.", ["Il parle comme…", ["S’il était expert", "S’il était ignorant", "S’il dormait"], 0], ["Si on le contredit ?", ["On est réduit au silence", "On le remercie", "On part"], 0], ["Sans lui ?", ["Le projet serait déjà fini", "Le projet serait perdu", "Rien"], 0]], ["Dovunque vada, porta con sé un libro. Comunque vadano le cose, non perde la calma. Qualsiasi cosa dica, magari ha ragione lui.", ["Il emporte…", ["Un livre", "Un sac", "Un chien"], 0], ["Attitude ?", ["Toujours calme", "Nerveux", "Triste"], 0]]], "l": [["Chiunque sia, non aprire la porta. Qualunque cosa ti dicano, non crederci.", ["Consigne ?", ["Ne pas ouvrir", "Ouvrir", "Appeler"], 0], ["Que croire ?", ["Rien de ce qu’on dit", "Tout", "La moitié"], 0]], ["Fa come se niente fosse. Se non fosse stato per te, avrei perso tutto.", ["Il fait…", ["Comme si de rien n’était", "Le malheureux", "Le fou"], 0], ["Sans toi ?", ["Il aurait tout perdu", "Il aurait gagné", "Rien"], 0]]], "w": [["Écrivez 3 phrases avec come se, qualunque, chiunque.", ["come se", "qualunque", "chiunque"], "Parla come se fosse esperto. Qualunque cosa succeda, ti aiuto. Chiunque sia, entri."]], "s": [["Décrivez une attitude avec « come se ».", "Parla come se sapesse tutto, ma non sa niente."]], "ex": [["Parla come se fosse esperto.", "Il parle comme s’il était expert."], ["Qualunque cosa succeda, ti aiuterò.", "Quoi qu’il arrive, je t’aiderai."], ["Chiunque sia, non aprire.", "Qui que ce soit, n’ouvre pas."]]}], ["C2", 2, {"r": [["Non solo la stampa è libera, ma è anche indispensabile. Chi può restare indifferente di fronte alla verità? Non la forza, ma la ragione deve guidare il dibattito. In conclusione, difendere la libertà di stampa è difendere la democrazia.", ["La presse est…", ["Libre et indispensable", "Inutile", "Dangereuse"], 0], ["Qui doit guider le débat ?", ["La raison", "La force", "L’argent"], 0], ["Conclusion ?", ["Défendre la presse = défendre la démocratie", "La presse est corrompue", "Rien"], 0]], ["L’editoriale esordisce con una domanda retorica: « Fino a quando tollereremo l’ingiustizia? ». Poi, c o.", ["Situation ?", ["Elle s’est améliorée", "Elle empire", "Stable"], 0], ["Bilan ?", ["Positif", "Négatif", "Nul"], 0]]], "l": [["Beninteso, nessuno lo nega. Di fatto, la situazione è migliorata. Tutto sommato, direi che va bene.", ["Situation ?", ["Améliorée", "Pire", "Stable"], 0], ["Conclusion ?", ["Ça va bien", "Ça va mal", "Aucune"], 0]], ["In ultima analisi, serve più equità. Per contro, i costi aumentano.", ["Besoin ?", ["Plus d’équité", "Moins d’équité", "Aucun"], 0], ["Les coûts…", ["Augmentent", "Baissent", "Stagnent"], 0]]], "w": [["Rédigez une synthèse (3 phrases).", ["in ultima analisi", "tutto sommato", "per contro"], "In ultima analisi, il progetto funziona. Tutto sommato, è positivo. Per contro, costa molto."]], "s": [["Concluez avec nuance.", "Tutto sommato, direi che va bene."]], "ex": [["In ultima analisi, funziona.", "En dernière analyse, ça fonctionne."], ["Tutto sommato, va bene.", "Tout bien considéré, ça va."], ["Per contro, costa molto.", "En revanche, cela coûte cher."]]}]];
